# 构建并推送 Docker 镜像到 GitHub Container Registry（GHCR）
#
# 镜像地址：ghcr.io/<owner>/<repo>
# 标签：手动触发 → yyMMdd-HHmm + sha-xxxxxxx；在默认分支上触发时另打 latest
# 触发：仅手动（Actions → Docker Image → Run workflow，可指定平台与是否推送）
#
# 说明：镜像内是「ZLM + .NET 运行时 + 应用」，Dockerfile 在容器里 dotnet publish，
# 因此 arm64 需要 QEMU 模拟（会很慢），默认只构建 linux/amd64，需要多架构时手动触发并填平台。

name: Docker Image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Buildx 平台（逗号分隔，如 linux/amd64,linux/arm64）"
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "推送到 GHCR（关闭则只构建验证）"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  TZ: Asia/Shanghai

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Buildx & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version tag (yyMMdd-HHmm, Asia/Shanghai)
        id: version
        run: |
          echo "tag=$(TZ=Asia/Shanghai date +%y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(inputs.platforms || 'linux/amd64', 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker 镜像"
            echo ""
            echo "**镜像：** \`${{ steps.image.outputs.name }}\`"
            echo ""
            echo "**平台：** \`${{ inputs.platforms || 'linux/amd64' }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取示例（私有包需先 docker login ghcr.io -u <用户名> --password-stdin）："
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
