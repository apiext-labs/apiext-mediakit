# Manual publish of Apiext.MediaKit multi-arch image to GHCR via Docker Buildx.
# Actions → Docker GHCR → Run workflow
#
# Image: ghcr.io/<owner>/<repo>:<yyMMdd-HHmm>
# Platforms (default): linux/amd64,linux/arm64

name: Docker Release

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Buildx platforms (comma-separated)"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

env:
  REGISTRY: ghcr.io
  # lowercase required by GHCR
  IMAGE_NAME: ${{ github.repository }}
  TZ: Asia/Shanghai

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Buildx multi-arch & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version tag (yyMMdd-HHmm, Asia/Shanghai)
        id: version
        run: |
          TAG="$(TZ=Asia/Shanghai date +%y%m%d-%H%M)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: ${{ inputs.platforms }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name (lowercase)
        id: image
        run: |
          name="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-,format=short

      - name: Build and push (Buildx multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## GHCR multi-arch image published (Buildx)"
            echo ""
            echo "**Version:** \`${{ steps.version.outputs.tag }}\`"
            echo ""
            echo "**Platforms:** \`${{ inputs.platforms }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull example (Docker pulls the matching arch automatically):"
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}"
            echo "docker pull ${{ steps.image.outputs.name }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
